name: ci

on:
  push:
  pull_request:

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy scripts

      - name: Unit tests
        run: pytest

      - name: pip-audit (CVE)
        run: pip-audit

      - name: Bandit (security lint)
        run: bandit -r scripts
