[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[project]
name = "nomad-lakehouse"
version = "0.1.0"
description = "Linux-first local lakehouse on MinIO + Apache Iceberg"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0,<3.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "structlog>=24.0.0,<25.0.0",
  "requests>=2.32.0,<3.0.0"
]

[project.optional-dependencies]
lakehouse = [
  "pyiceberg>=0.6.0,<0.7.0",
  "duckdb>=1.0.0,<2.0.0"
]

dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "mypy>=1.10.0,<2.0.0",
  "pandas-stubs>=2.2.0.240909,<3.0.0",
  "ruff>=0.5.0,<1.0.0",
  "pip-audit>=2.7.0,<3.0.0",
  "bandit>=1.7.0,<2.0.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
